<title>Stavby a rekonstrukce, s.r.o.</title>
<script>
  (function () {
    var lang = (navigator.language || 'cs').toLowerCase();
    var target = 'cs/index.html';

    else if (lang.indexOf('es') === 0) target = 'es/index.html';
    window.location.replace(target);
  })();
</script>

</html>
